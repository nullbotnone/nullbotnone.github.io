<!doctype html>
<html lang="zh-CN" data-lang="zh">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link rel="icon" href="favicon.svg" type="image/svg+xml" />
    <meta name="theme-color" content="#14170f" />
    <title>slashai.app｜圣经地图、原文工具与敬拜资源导航</title>
    <meta name="description" content="给教会和信徒的工具导航：圣经地图、原文查经、读经计划、敬拜诗歌与神学装备，三十余个精选站点，加上本站自制的三个开源工具。" />
    <meta property="og:type" content="website" />
    <meta property="og:title" content="slashai.app" />
    <meta property="og:description" content="圣经地图、原文工具与敬拜资源导航。" />
    <meta property="og:url" content="https://slashai.app/" />
    <meta property="og:site_name" content="slashai.app" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <header class="topbar">
      <a class="brand" href="/">
        <svg class="brand-mark" viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 4.5 7 15h3.6v12.5h10.8V15H25z" />
        </svg>
        <span>slashai<span class="brand-dim">.app</span></span>
      </a>
      <div class="topbar-tools">
        <div class="seg" role="group" id="langseg"></div>
        <button class="iconbtn" id="themebtn" type="button" aria-label="theme"></button>
      </div>
    </header>

    <main>
      <section class="hero">
        <h1 id="tagline"></h1>
        <p class="hero-sub" id="herosub"></p>

        <form class="jump" id="jump" autocomplete="off">
          <label class="jump-label" for="jumpq" id="jumplabel"></label>
          <div class="jump-row">
            <input id="jumpq" type="text" />
            <select id="jumpv"></select>
            <button type="submit" id="jumpgo"></button>
          </div>
          <p class="jump-hint" id="jumphint"></p>
        </form>
      </section>

      <section class="verse" id="verse" hidden>
        <div class="verse-body">
          <blockquote id="versetext"></blockquote>
          <cite id="verseref"></cite>
        </div>
        <div class="verse-actions">
          <button type="button" class="ghost" id="verseshuffle"></button>
          <button type="button" class="ghost" id="versecopy"></button>
          <a class="ghost" id="verseopen" target="_blank" rel="noopener"></a>
        </div>
      </section>

      <section class="finder">
        <div class="search">
          <svg viewBox="0 0 24 24" aria-hidden="true" class="search-icon">
            <circle cx="11" cy="11" r="7" /><path d="m16.5 16.5 4 4" />
          </svg>
          <input id="q" type="search" />
          <kbd id="slashkey">/</kbd>
        </div>
        <div class="chips" id="chips"></div>
      </section>

      <div id="results"></div>
      <p class="empty" id="empty" hidden></p>

      <noscript>
        <p class="empty">
          这个页面用 JavaScript 渲染工具清单。请开启 JavaScript，或直接前往
          <a href="/messiah-land-map/">弥赛亚之地</a>、
          <a href="/apostles-sea-map/">直到地极</a>、
          <a href="/worship-wiki/">敬拜维基</a>。
        </p>
      </noscript>
    </main>

    <footer>
      <p id="footnote"></p>
      <p class="foot-links">
        <a href="https://github.com/nullbotnone" target="_blank" rel="noopener">GitHub</a>
        <span aria-hidden="true">·</span>
        <a href="https://github.com/nullbotnone/nullbotnone.github.io" target="_blank" rel="noopener" id="suggest"></a>
      </p>
    </footer>

    <script src="app.js"></script>
  </body>
</html>
